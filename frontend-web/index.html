<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Deal Dash - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { background-color: #212529; color: #f8f9fa; }
        .sonic-card { transition: transform 0.2s; }
        .sonic-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <div class="container mt-5">
        
        <div class="row mb-5">
            <div class="col-12 text-center">
                <h1 class="display-3 text-info fw-bold">Sonic Deal Dash</h1>
                <p class="lead">Track speedruns, prices, and predictions for the blue blur.</p>
            </div>
        </div>

        <div class="row mb-5 justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card bg-secondary text-white border-info shadow">
                    <div class="card-header border-info">
                        <h4 class="mb-0 text-info">Add to Wishlist & Predictor</h4>
                    </div>
                    <div class="card-body">
                        <form id="wishlistForm">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="gameName" placeholder="Game Name (e.g. Sonic Racing Crossworlds)" required>
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" id="userEmail" placeholder="Your Email" required>
                            </div>
                            <button type="submit" class="btn btn-info w-100 fw-bold">Save to Cloud & Analyze</button>
                        </form>
                        
                        <div id="statusMessage" class="mt-3 text-warning fw-bold text-center"></div>
                        
                        <div id="emailLinkContainer" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-12">
                <h2 class="text-info border-bottom border-info pb-2 mb-4">⏱️ Sonic Base Games & Speedruns</h2>
                <div id="speedrunGrid" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
                    <div class="text-center w-100"><div class="spinner-border text-info" role="status"></div></div>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-12">
                <h2 class="text-warning border-bottom border-warning pb-2 mb-4">🛒 DLCs, Expansions & Extras</h2>
                <div id="dealsGrid" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
                    </div>
            </div>
        </div>

        <div class="row mt-5 mb-5">
            <div class="col-12">
                <div class="card bg-secondary text-white border-info shadow">
                    <div class="card-header border-info">
                        <h4 class="mb-0 text-info"> Current Tracking (Live Prices)</h4>
                    </div>
                    <div class="card-body">
                        <ul id="trackingList" class="list-group list-group-flush">
                            <li class="list-group-item bg-secondary text-white border-info">Cargando tu radar...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </div> <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
